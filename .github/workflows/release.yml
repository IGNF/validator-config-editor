name: Release

# Publie la version de package.json (main) sous forme d'un tag vX.Y.Z pointant sur un commit
# qui contient dist/ : les dépôts de configuration installent l'outil sans build ni dépendance
# (plan 001, R1).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "Le tag v$version existe déjà : incrémenter la version dans package.json" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Commit de release (avec dist/) et tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add --force dist
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes
