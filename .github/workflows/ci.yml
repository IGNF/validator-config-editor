name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validateurs générés à jour
        run: npm run schemas && git diff --exit-code src/core/schemas/generated
      - run: npm run lint
      - run: npm run test:coverage
      - name: Build (typecheck, interface, CLI)
        run: npm run build
      - name: CLI construite
        run: node bin/vce.js check tests/fixtures/config

  # Version de @playwright/test (figée dans package.json) : choisit l'image des tests de bout en bout.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

  # Image Playwright officielle : navigateurs et dépendances système déjà installés, sans apt
  # (le miroir Ubuntu des runners est parfois très lent : jusqu'à 16 min pour --with-deps).
  e2e:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      # Firefox refuse de tourner en root : utilisateur du runner.
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests de bout en bout
        run: npm run test:e2e
